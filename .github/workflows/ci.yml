name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: pip install pytest

      - name: Byte-compile Goalkeeper Core + entrypoints
        run: |
          python -m compileall -q goalkeeper_core
          python -m py_compile bin/goalkeeper bin/goalkeeper_hook.py

      - name: Validate JSON manifests + schema
        run: |
          for f in hosts/claude/.claude-plugin/plugin.json \
                   hosts/codex/.codex-plugin/plugin.json \
                   hosts/claude/hooks/hooks.json \
                   hosts/codex/hooks/hooks.json \
                   hosts/codex/marketplace.json \
                   schema/goalkeeper.contract.schema.json; do
            python -c "import json; json.load(open('$f')); print('OK', '$f')"
          done

      - name: Validate every example contract (strict)
        run: |
          for d in examples/*/; do
            ( cd "$d" && python "$GITHUB_WORKSPACE/bin/goalkeeper" validate-contract --strict )
          done

      - name: Run test suite
        run: python -m pytest -q
