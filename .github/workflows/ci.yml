name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        working-directory: goalkeeper-loop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: pip install pytest

      - name: Syntax-check Python helpers
        run: python -m py_compile bin/goalkeeper bin/goalkeeper_hook.py

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json \
                   hooks/hooks.json examples/marketplace.json; do
            python -c "import json,sys; json.load(open('$f')); print('OK', '$f')"
          done

      - name: Run test suite
        run: python -m pytest -q tests/
