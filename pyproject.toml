# Dev/CI convenience only. The runtime requires NO third-party packages and is
# never installed — bin/goalkeeper bootstraps goalkeeper_core onto sys.path.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goalkeeper-core"
version = "0.4.0"
description = "Evidence-first control plane for agentic work (Goalkeeper Core)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
packages = ["goalkeeper_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
